# This workflow creates an issue when Firebase deployment fails due to missing secrets
# It helps repository owners quickly identify and fix the configuration problem

name: Deployment Secret Check

on:
  workflow_run:
    workflows: ["Firebase Deploy"]
    types:
      - completed

permissions:
  issues: write
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Check if issue already exists
        id: check-issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment,secrets,configuration',
              per_page: 10
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('GitHub Secrets Not Configured')
            );
            
            core.setOutput('issue-exists', existingIssue ? 'true' : 'false');
            if (existingIssue) {
              core.setOutput('issue-number', existingIssue.number);
            }
      
      - name: Create or update issue
        if: steps.check-issue.outputs.issue-exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = `## 🚨 Firebase Deployment Failing - GitHub Secrets Not Configured

### Problem
The Firebase Deploy workflow is failing because required GitHub Secrets are missing.

**This is a CONFIGURATION issue, not a code issue.**

### Failed Workflow
- Run: ${{ github.event.workflow_run.html_url }}
- Commit: ${{ github.event.workflow_run.head_sha }}
- Branch: ${{ github.event.workflow_run.head_branch }}

### Required Secrets (10 total)
All of these must be configured in repository settings:

1. \`FIREBASE_PROJECT_ID\` - Firebase project ID
2. \`FIREBASE_TOKEN\` - Token from \`firebase login:ci\`
3. \`NEXT_PUBLIC_FIREBASE_API_KEY\` - Firebase web app config
4. \`NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN\` - Firebase web app config
5. \`NEXT_PUBLIC_FIREBASE_PROJECT_ID\` - Firebase web app config
6. \`NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET\` - Firebase web app config
7. \`NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID\` - Firebase web app config
8. \`NEXT_PUBLIC_FIREBASE_APP_ID\` - Firebase web app config
9. \`NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY\` - Stripe publishable key
10. \`NEXT_PUBLIC_APP_URL\` - Production URL (e.g., https://www.SAVR.cam)

### Fix This Now (5 minutes)

1. **Go to**: https://github.com/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions

2. **Click**: "New repository secret" for each of the 10 secrets listed above

3. **Get values from**:
   - Firebase: https://console.firebase.google.com (your project settings)
   - Stripe: https://dashboard.stripe.com/apikeys
   - Generate token: Run \`firebase login:ci\` in terminal

4. **Detailed guide**: See [\`GITHUB_SECRETS_SETUP.md\`](../blob/main/GITHUB_SECRETS_SETUP.md)

5. **Quick reference**: See [\`DEPLOYMENT_BLOCKED_README.md\`](../blob/main/DEPLOYMENT_BLOCKED_README.md)

### After Adding Secrets

- Re-run the failed workflow: ${{ github.event.workflow_run.html_url }}
- Or push a new commit to trigger deployment
- This issue will be automatically closed when deployment succeeds

### Important Notes

❌ **Cannot be fixed by code changes** - Secrets must be manually configured in GitHub settings
✅ **One-time setup** - Once configured, deployments will work automatically
🔒 **Security** - Never commit secrets to code; always use GitHub's encrypted secret storage

---

**Need help?** See the documentation files linked above or contact the development team.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 URGENT: GitHub Secrets Not Configured - Deployment Blocked',
              body: issueBody,
              labels: ['deployment', 'secrets', 'configuration', 'urgent']
            });
