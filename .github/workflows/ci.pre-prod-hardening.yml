  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start Supabase
        run: npx supabase start
      - name: Test migrations
        run: npx supabase db reset --local
      - name: Stop Supabase
        if: always()
        run: npx supabase stop

  check-env-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .env.example files exist
        run: |
          if [ ! -f ".env.example" ]; then
            echo "❌ Missing .env.example in root"
            exit 1
          fi
          echo "✅ Root .env.example exists"
      - name: Check for secrets in code
        run: |
          # Check for common secret patterns
          if grep -r -E "(api_key|apikey|secret|password|token).*=.*['\"][a-zA-Z0-9]{20,}" --include="*.ts" --include="*.tsx" --include="*.js" --exclude-dir=node_modules .; then
            echo "⚠️  Potential hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

