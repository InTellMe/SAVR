# Deploy to Firebase (Hosting, Functions, Firestore, Storage) on push to main.
#
# Required GitHub Secrets (set in repository Settings → Environments → production → Secrets):
# ┌─────────────────────────────────────────────────────────────────────────────────┐
# │ Firebase Authentication (choose ONE method):                                    │
# │   Method 1 (Token - Recommended): FIREBASE_TOKEN                               │
# │             - Token from `firebase login:ci` command                           │
# │             - Authenticates as project user, avoids actAs permission issues    │
# │   Method 2 (Service Account): FIREBASE_SERVICE_ACCOUNT_JSON                   │
# │             - JSON key content from Firebase Console service account           │
# │             - Requires iam.serviceAccounts.actAs on App Engine default SA     │
# │                                                                                 │
# │ Project Configuration:                                                          │
# │   FIREBASE_PROJECT_ID - Firebase project identifier                            │
# │ Next.js Build Variables (public, required for build):                          │
# │   NEXT_PUBLIC_FIREBASE_API_KEY                                                 │
# │   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN                                             │
# │   NEXT_PUBLIC_FIREBASE_PROJECT_ID                                              │
# │   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET                                          │
# │   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID                                     │
# │   NEXT_PUBLIC_FIREBASE_APP_ID                                                  │
# │   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY                                           │
# │   NEXT_PUBLIC_APP_URL                                                          │
# └─────────────────────────────────────────────────────────────────────────────────┘
#
# Security: This workflow only runs on direct pushes to main (not PRs or forks).
# Secrets are NOT available to workflows triggered from forked repositories.

name: Firebase Deploy
permissions:
  contents: read

on:
  push:
    branches: [main]

env:
  SERVICE_ACCOUNT_FILE: firebase-service-account.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        working-directory: web
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase Authentication
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Configuring Firebase Authentication"

          # Method 1: Firebase Token (preferred - authenticates as project user,
          # avoids iam.serviceAccounts.actAs requirement for functions deploy)
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Using token-based authentication"
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> $GITHUB_ENV
            echo "✓ Firebase token configured"

          # Method 2: Service Account JSON (fallback)
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Using service account authentication"
            SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/${{ env.SERVICE_ACCOUNT_FILE }}"
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SERVICE_ACCOUNT_PATH"
            chmod 600 "$SERVICE_ACCOUNT_PATH"
            # Validate service account file was written successfully
            if [ ! -s "$SERVICE_ACCOUNT_PATH" ]; then
              echo "::error::Service account file is empty or does not exist"
              exit 1
            fi
            echo "GOOGLE_APPLICATION_CREDENTIALS=$SERVICE_ACCOUNT_PATH" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT_PATH=$SERVICE_ACCOUNT_PATH" >> $GITHUB_ENV
            echo "✓ Service account credentials configured"

          else
            echo "::error::No Firebase authentication configured."
            echo "Set FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_JSON in GitHub Secrets."
            exit 1
          fi

          echo "::endgroup::"

      - name: Delete Deprecated Functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "::group::Deleting deprecated Firebase functions"

          # CI-safe deletion: Firebase deploy aborts in non-interactive mode when
          # functions exist remotely but not in source. Delete explicitly with --force.
          DELETE_ARGS=(
            functions:delete
            createStripeCheckout
            --region us-central1
            --force
            --non-interactive
          )

          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            DELETE_ARGS+=(--project "$FIREBASE_PROJECT_ID")
            echo "Using project: $FIREBASE_PROJECT_ID"
          fi

          # Token auth: pass via --token flag
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "✓ Using token-based authentication"
            DELETE_ARGS+=(--token "$FIREBASE_TOKEN")
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "✓ Using service account authentication"
          fi

          # Delete function, continue if it doesn't exist (exit code 1)
          echo "Executing: firebase ${DELETE_ARGS[*]}"
          if firebase "${DELETE_ARGS[@]}"; then
            echo "✓ Function deleted successfully"
          else
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "⚠ Function does not exist or already deleted (non-fatal)"
            else
              echo "::error::Function deletion failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi
          fi

          echo "::endgroup::"

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "::group::Deploying to Firebase"

          DEPLOY_ARGS=(
            --only hosting,functions,firestore,storage
            --non-interactive
          )

          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            DEPLOY_ARGS+=(--project "$FIREBASE_PROJECT_ID")
            echo "Using project: $FIREBASE_PROJECT_ID"
          else
            echo "::warning::FIREBASE_PROJECT_ID not set, using default from firebase.json"
          fi

          # Token auth: pass via --token flag (authenticates as the user who
          # generated the token, which has actAs permissions for functions deploy)
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "✓ Using token-based authentication"
            DEPLOY_ARGS+=(--token "$FIREBASE_TOKEN")
          elif [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "✓ Using service account authentication"
            if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
              echo "::error::Service account file not found at: $GOOGLE_APPLICATION_CREDENTIALS"
              exit 1
            fi
          else
            echo "::error::No authentication configured"
            exit 1
          fi

          echo "Executing: firebase deploy ${DEPLOY_ARGS[*]}"
          firebase deploy "${DEPLOY_ARGS[@]}"

          echo "::endgroup::"
          echo "✅ Deployment completed successfully"

      - name: Cleanup
        if: always()
        run: |
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/${{ env.SERVICE_ACCOUNT_FILE }}"
          if [ -f "$SERVICE_ACCOUNT_PATH" ]; then
            rm -f "$SERVICE_ACCOUNT_PATH"
            echo "✓ Cleaned up service account credentials"
          fi
