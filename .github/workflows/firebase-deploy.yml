# Deploy to Firebase (Hosting, Functions, Firestore, Storage) on push to main.
#
# Required GitHub Secrets (set in repository Settings → Secrets and variables → Actions):
# ┌─────────────────────────────────────────────────────────────────────────────────┐
# │ Firebase Authentication (choose ONE method):                                    │
# │   Method 1 (Service Account - Recommended): FIREBASE_SERVICE_ACCOUNT_JSON      │
# │             - JSON key content from Firebase Console service account           │
# │             - Uses GOOGLE_APPLICATION_CREDENTIALS environment variable         │
# │   Method 2 (Token - Legacy): FIREBASE_TOKEN                                    │
# │             - Token from `firebase login:ci` command                           │
# │             - Passed via both FIREBASE_TOKEN env var AND --token flag          │
# │                                                                                 │
# │ Note: The workflow supports both methods and will use whichever is configured. │
# │ Token authentication uses BOTH environment variable AND --token flag for       │
# │ maximum compatibility (three authentication paths total).                      │
# │                                                                                 │
# │ Project Configuration:                                                          │
# │   FIREBASE_PROJECT_ID - Firebase project identifier                            │
# │ Next.js Build Variables (public, required for build):                          │
# │   NEXT_PUBLIC_FIREBASE_API_KEY                                                 │
# │   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN                                             │
# │   NEXT_PUBLIC_FIREBASE_PROJECT_ID                                              │
# │   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET                                          │
# │   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID                                     │
# │   NEXT_PUBLIC_FIREBASE_APP_ID                                                  │
# │   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY                                           │
# │   NEXT_PUBLIC_APP_URL                                                          │
# └─────────────────────────────────────────────────────────────────────────────────┘
#
# Security: This workflow only runs on direct pushes to main (not PRs or forks).
# Secrets are NOT available to workflows triggered from forked repositories.
#
# Note: Secrets must be explicitly referenced and cannot be accessed dynamically
# through loops or arrays in GitHub Actions. Each secret requires a direct reference
# like ${{ secrets.SECRET_NAME }} at workflow parse time.

name: Firebase Deploy
permissions:
  contents: read

on:
  push:
    branches: [main]

env:
  # Centralized path for service account credentials
  SERVICE_ACCOUNT_FILE: firebase-service-account.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        working-directory: web
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase Authentication
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "::group::Configuring Firebase Authentication"
          
          # Use $RUNNER_TEMP for isolated temporary directory with centralized filename
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/${{ env.SERVICE_ACCOUNT_FILE }}"
          
          # Method 1: Service Account JSON (preferred for CI/CD)
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Using service account authentication"
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SERVICE_ACCOUNT_PATH"
            chmod 600 "$SERVICE_ACCOUNT_PATH"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$SERVICE_ACCOUNT_PATH" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT_PATH=$SERVICE_ACCOUNT_PATH" >> $GITHUB_ENV
            echo "✓ Service account credentials configured"
          
          # Method 2: Firebase Token (fallback)
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Using token-based authentication"
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> $GITHUB_ENV
            echo "✓ Firebase token configured"
          
          else
            echo "::warning::No Firebase authentication secrets configured in GitHub Actions"
            echo "Firebase CLI will attempt to use other authentication methods"
            echo "If deployment fails, configure FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_JSON secrets"
          fi
          
          echo "::endgroup::"

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "::group::Deploying to Firebase"
          
          # Build deployment command
          DEPLOY_ARGS=(
            --only hosting,functions,firestore,storage
            --non-interactive
          )
          
          # Add project ID if available
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            DEPLOY_ARGS+=(--project "$FIREBASE_PROJECT_ID")
            echo "Using project: $FIREBASE_PROJECT_ID"
          else
            echo "::warning::FIREBASE_PROJECT_ID not set, using default Firebase project from firebase.json"
          fi
          
          # Configure authentication if available
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "✓ Using service account authentication (GOOGLE_APPLICATION_CREDENTIALS)"
            if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
              echo "::error::Service account file not found at: $GOOGLE_APPLICATION_CREDENTIALS"
              exit 1
            fi
            # Service account auth works via GOOGLE_APPLICATION_CREDENTIALS env var
            # No additional flag needed
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "✓ Using token-based authentication (FIREBASE_TOKEN)"
            # Explicitly pass token via --token flag for highest priority
            DEPLOY_ARGS+=(--token "$FIREBASE_TOKEN")
          else
            echo "::warning::No authentication configured, Firebase CLI will use default credentials"
          fi
          
          # Execute deployment
          echo "Executing: firebase deploy ${DEPLOY_ARGS[*]}"
          firebase deploy "${DEPLOY_ARGS[@]}"
          
          echo "::endgroup::"
          echo "✅ Deployment completed successfully"

      - name: Cleanup
        if: always()
        run: |
          # Remove service account credentials file if it exists
          # Using centralized filename from env
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/${{ env.SERVICE_ACCOUNT_FILE }}"
          if [ -f "$SERVICE_ACCOUNT_PATH" ]; then
            rm -f "$SERVICE_ACCOUNT_PATH"
            echo "✓ Cleaned up service account credentials"
          fi
